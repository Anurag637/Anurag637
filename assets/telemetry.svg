<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 230" width="100%" height="230" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="telemetryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes blinkLed {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
        50% { opacity: 0.35; filter: none; }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.75; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-20px); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateY(240px); opacity: 0; }
      }
      .live-led { animation: blinkLed 2.2s infinite ease-in-out; }
      .card-border { animation: pulseBorder 4s infinite ease-in-out; }
      .scanner-line { animation: scanBeam 6s linear infinite; }
      .mono-text { font-family: 'Fira Code', 'Courier New', Consolas, monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Base Console Frame -->
  <rect width="854" height="230" rx="14" fill="url(#telemetryBg)"/>
  <rect class="card-border" width="854" height="230" rx="14" fill="none" stroke="url(#cyanGrad)" stroke-width="1.4"/>

  <!-- Console Header Bar -->
  <rect x="0" y="0" width="854" height="38" rx="14" fill="#0f172a" opacity="0.85"/>
  <rect x="0" y="24" width="854" height="14" fill="#0f172a" opacity="0.85"/>
  <line x1="0" y1="38" x2="854" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="40" cy="19" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="56" cy="19" r="5" fill="#10b981" opacity="0.85"/>

  <!-- Console Title -->
  <text class="mono-text" x="80" y="23" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">
    <tspan fill="#38bdf8">SYSTEM_TELEMETRY</tspan> :: ANURAG-AI-CLUSTER-NODE-01
  </text>

  <!-- Live Cluster Status Badge (Top Right) -->
  <g transform="translate(680, 11)">
    <rect x="0" y="0" width="154" height="18" rx="9" fill="#064e3b" stroke="#059669" stroke-width="1" opacity="0.7"/>
    <circle class="live-led" cx="12" cy="9" r="3.5" fill="#34d399"/>
    <text class="sans-text" x="22" y="12.5" font-size="9.5" font-weight="700" fill="#a7f3d0" letter-spacing="0.8">
      CLUSTER: OPTIMAL (0% DROP)
    </text>
  </g>

  <!-- Metric Column 1: Latency & Throughput -->
  <g transform="translate(24, 52)">
    <rect width="254" height="126" rx="10" fill="#090f1a" stroke="#1e293b" stroke-width="1"/>
    <!-- Top label -->
    <text class="sans-text" x="14" y="22" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
      ⚡ LATENCY &amp; THROUGHPUT
    </text>
    <text class="mono-text" x="14" y="44" font-size="10" fill="#64748b">
      P99 Cache Hit Latency: <tspan fill="#34d399" font-weight="700">42ms</tspan>
    </text>
    <text class="mono-text" x="14" y="62" font-size="10" fill="#64748b">
      P99 Model Inference:   <tspan fill="#38bdf8" font-weight="700">310ms</tspan>
    </text>
    <text class="mono-text" x="14" y="80" font-size="10" fill="#64748b">
      Gateway Peak Capacity: <tspan fill="#c084fc" font-weight="700">850 req/s</tspan>
    </text>

    <!-- Progress Bar -->
    <text class="mono-text" x="14" y="102" font-size="9.5" fill="#94a3b8">
      Semantic Cache Hit Rate: 84.6%
    </text>
    <rect x="14" y="108" width="226" height="6" rx="3" fill="#1e293b"/>
    <rect x="14" y="108" width="191" height="6" rx="3" fill="url(#cyanGrad)">
      <animate attributeName="width" values="180;195;191" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Metric Column 2: Inference & Serving Topology -->
  <g transform="translate(300, 52)">
    <rect width="254" height="126" rx="10" fill="#090f1a" stroke="#1e293b" stroke-width="1"/>
    <text class="sans-text" x="14" y="22" font-size="11.5" font-weight="700" fill="#818cf8" letter-spacing="0.5">
      🧠 SERVING &amp; QUANTIZATION
    </text>
    <text class="mono-text" x="14" y="44" font-size="10" fill="#64748b">
      Engines: <tspan fill="#e2e8f0">vLLM • Transformers • Ollama</tspan>
    </text>
    <text class="mono-text" x="14" y="62" font-size="10" fill="#64748b">
      Formats: <tspan fill="#818cf8">GGUF • AWQ • FP16 • TensorRT</tspan>
    </text>
    <text class="mono-text" x="14" y="80" font-size="10" fill="#64748b">
      KV Cache Optimization: <tspan fill="#34d399">PagedAttention</tspan>
    </text>

    <!-- Progress Bar -->
    <text class="mono-text" x="14" y="102" font-size="9.5" fill="#94a3b8">
      VRAM Compression Ratio: 4.2x
    </text>
    <rect x="14" y="108" width="226" height="6" rx="3" fill="#1e293b"/>
    <rect x="14" y="108" width="206" height="6" rx="3" fill="url(#purpleGrad)">
      <animate attributeName="width" values="198;210;206" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Metric Column 3: Vector Knowledge & RAG Indexing -->
  <g transform="translate(576, 52)">
    <rect width="254" height="126" rx="10" fill="#090f1a" stroke="#1e293b" stroke-width="1"/>
    <text class="sans-text" x="14" y="22" font-size="11.5" font-weight="700" fill="#c084fc" letter-spacing="0.5">
      🗄️ RAG RETRIEVAL &amp; VECTORS
    </text>
    <text class="mono-text" x="14" y="44" font-size="10" fill="#64748b">
      Vector Stores: <tspan fill="#e2e8f0">Qdrant • Chroma • Redis</tspan>
    </text>
    <text class="mono-text" x="14" y="62" font-size="10" fill="#64748b">
      Index Mode:   <tspan fill="#c084fc">Hybrid (Dense + Sparse)</tspan>
    </text>
    <text class="mono-text" x="14" y="80" font-size="10" fill="#64748b">
      Re-Ranking:    <tspan fill="#38bdf8">ColBERT / Cross-Encoder</tspan>
    </text>

    <!-- Progress Bar -->
    <text class="mono-text" x="14" y="102" font-size="9.5" fill="#94a3b8">
      Top-5 Context Precision: 92.4%
    </text>
    <rect x="14" y="108" width="226" height="6" rx="3" fill="#1e293b"/>
    <rect x="14" y="108" width="208" height="6" rx="3" fill="url(#greenGrad)">
      <animate attributeName="width" values="200;212;208" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom Telemetry Footer Strip -->
  <g transform="translate(24, 192)">
    <rect width="806" height="26" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
    <text class="mono-text" x="12" y="17" font-size="10" fill="#64748b">
      <tspan fill="#38bdf8">ACTIVE MICROSERVICES:</tspan> FastAPI-Gateway:8000 <tspan fill="#10b981">●</tspan> &#160;|&#160; Redis-SemanticCache:6379 <tspan fill="#10b981">●</tspan> &#160;|&#160; Qdrant-VectorCluster:6333 <tspan fill="#10b981">●</tspan> &#160;|&#160; vLLM-InferenceEngine:8001 <tspan fill="#10b981">●</tspan>
    </text>
  </g>
</svg>
