<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 200" width="100%" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="854" height="200" rx="16" fill="url(#bgGradient)"/>
  <rect width="854" height="200" rx="16" fill="none" stroke="url(#glowGradient)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="654" y1="0" x2="654" y2="200"/>
    <line x1="734" y1="0" x2="734" y2="200"/>
    <line x1="814" y1="0" x2="814" y2="200"/>
    <line x1="0" y1="40" x2="854" y2="40"/>
    <line x1="0" y1="100" x2="854" y2="100"/>
    <line x1="0" y1="160" x2="854" y2="160"/>
  </g>

  <!-- Glowing Accent Curves -->
  <path d="M 0 160 Q 200 120 427 150 T 854 130" fill="none" stroke="url(#glowGradient)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <path d="M 0 180 Q 250 140 500 170 T 854 160" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Floating Tech Dots -->
  <circle cx="80" cy="50" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="780" cy="60" r="3" fill="#c084fc" opacity="0.6"/>
  <circle cx="150" cy="150" r="2" fill="#818cf8" opacity="0.4"/>
  <circle cx="720" cy="140" r="2.5" fill="#38bdf8" opacity="0.5"/>

  <!-- Main Name Title -->
  <text x="427" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="3" fill="url(#textGrad)">
    ANURAG PANDEY
  </text>

  <!-- Subtitle -->
  <text x="427" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#e2e8f0" opacity="0.95">
    AI &amp; MACHINE LEARNING ENGINEER
  </text>

  <!-- Focus Tags Pill -->
  <g transform="translate(427, 160)">
    <rect x="-190" y="-14" width="380" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#94a3b8">
      <tspan fill="#38bdf8">LLMs</tspan> • <tspan fill="#818cf8">RAG</tspan> • <tspan fill="#c084fc">Computer Vision</tspan> • <tspan fill="#38bdf8">FastAPI</tspan>
    </text>
  </g>
</svg>
