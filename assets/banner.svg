<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 200" width="100%" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141a26"/>
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #38bdf8; #818cf8; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmering Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Laser Scan Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatUp1 {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(-12px); opacity: 0.9; }
      }
      @keyframes floatUp2 {
        0%, 100% { transform: translateY(0px); opacity: 0.4; }
        50% { transform: translateY(-16px); opacity: 1; }
      }
      @keyframes floatUp3 {
        0%, 100% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(-10px); opacity: 0.8; }
      }
      @keyframes radarSweep {
        0% { transform: translateX(-150px); opacity: 0; }
        15% { opacity: 0.7; }
        85% { opacity: 0.7; }
        100% { transform: translateX(950px); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }
      @keyframes techPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      .dot1 { animation: floatUp1 4s ease-in-out infinite; }
      .dot2 { animation: floatUp2 5s ease-in-out infinite; }
      .dot3 { animation: floatUp3 4.5s ease-in-out infinite; }
      .scanner { animation: radarSweep 7s linear infinite; }
      .pulse-border { animation: pulseGlow 4s ease-in-out infinite; }
      .tag-glow { animation: techPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect width="854" height="200" rx="16" fill="url(#bgGradient)"/>
  
  <!-- Cyberpunk Subtle Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.5">
    <line x1="60" y1="0" x2="60" y2="200"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="220" y1="0" x2="220" y2="200"/>
    <line x1="634" y1="0" x2="634" y2="200"/>
    <line x1="714" y1="0" x2="714" y2="200"/>
    <line x1="794" y1="0" x2="794" y2="200"/>
    <line x1="0" y1="40" x2="854" y2="40"/>
    <line x1="0" y1="100" x2="854" y2="100"/>
    <line x1="0" y1="160" x2="854" y2="160"/>
  </g>

  <!-- Scanning Radar Beam Animation -->
  <rect class="scanner" x="0" y="0" width="80" height="200" fill="url(#scanGrad)" opacity="0.3"/>

  <!-- Pulsing Glowing Border -->
  <rect class="pulse-border" width="854" height="200" rx="16" fill="none" stroke="url(#borderGradient)" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Flowing Geometric Neural Connections -->
  <path d="M 0 165 Q 213 115 427 150 T 854 135" fill="none" stroke="url(#borderGradient)" stroke-width="2.2" opacity="0.45" filter="url(#glow)"/>
  <path d="M 0 185 Q 260 135 520 170 T 854 160" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25"/>

  <!-- Floating Glowing Particles / Neural Nodes -->
  <circle class="dot1" cx="95" cy="55" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="dot2" cx="760" cy="50" r="3.5" fill="#c084fc" filter="url(#glow)"/>
  <circle class="dot3" cx="170" cy="145" r="2.5" fill="#818cf8"/>
  <circle class="dot1" cx="710" cy="140" r="3" fill="#38bdf8"/>
  <circle class="dot2" cx="300" cy="35" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle class="dot3" cx="580" cy="35" r="2.2" fill="#c084fc" opacity="0.5"/>

  <!-- Status Indicator Badge (Top Right) -->
  <g transform="translate(735, 24)">
    <rect x="-8" y="-10" width="105" height="20" rx="10" fill="#0b1320" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="2" cy="0" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="12" y="3.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#34d399" letter-spacing="1">
      ONLINE • ACTIVE
    </text>
  </g>

  <!-- Name Title with Typography -->
  <text x="427" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="url(#textGrad)">
    ANURAG PANDEY
  </text>

  <!-- Subtitle -->
  <text x="427" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#f1f5f9" opacity="0.95">
    AI &amp; MACHINE LEARNING ENGINEER
  </text>

  <!-- Focus Tags Interactive Pill -->
  <g transform="translate(427, 158)">
    <rect x="-215" y="-14" width="430" height="27" rx="13.5" fill="#0f172a" stroke="url(#borderGradient)" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#cbd5e1">
      <tspan fill="#38bdf8">LLMs &amp; Agents</tspan> • <tspan fill="#818cf8">RAG Gateways</tspan> • <tspan fill="#c084fc">Computer Vision</tspan> • <tspan fill="#34d399">Production FastAPI</tspan>
    </text>
  </g>
</svg>
